<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZXTabs</title>
<style>
  :root {
    /* same tokens as src/styles.css */
    --bg: oklch(0.165 0.006 260); --bg-raise: oklch(0.205 0.007 260); --rule: oklch(0.27 0.008 260);
    --text: oklch(0.91 0.008 85); --text-dim: oklch(0.68 0.01 260); --chord: oklch(0.82 0.135 72);
    --focus: oklch(0.82 0.135 72 / 0.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0 }
  body { width: 280px; padding: 14px 16px 16px; background: var(--bg); color: var(--text);
    font: 13px/1.45 Geist, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased }
  h1 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px }
  h1 svg { color: var(--chord) }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--rule); border-radius: 12px; background: var(--bg-raise); cursor: pointer;
    font-size: 15px; font-weight: 500 }
  input { appearance: none; flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--rule);
    position: relative; cursor: pointer; transition: background .16s ease-out }
  input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--text); transition: translate .16s ease-out }
  input:checked { background: var(--chord) }
  input:checked::after { translate: 16px 0; background: var(--bg) }
  input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
  input:disabled, input:disabled + * { opacity: .5; cursor: default }
  p { margin-top: 10px; color: var(--text-dim) }
  @media (prefers-reduced-motion: reduce) { input, input::after { transition: none } }
</style>
</head>
<body>
  <h1><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5v14M12 5v14M19 5v14"/></svg>ZXTabs</h1>
  <label>Reader view <input type="checkbox" id="on" role="switch"></label>
  <p id="hint"></p>
  <script src="popup.js"></script>
</body>
</html>
